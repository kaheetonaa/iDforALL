<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset='utf-8'>
    <meta name="pwa-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="canonical" href="https://kaheetonaa.github.io/iDforALL/" />
    <title>iD4ALL</title>
    <link rel='stylesheet' href='dist/iD.css'>
    <link rel='icon' type="image/x-icon" href="icon/icon-4all.png">
    <link rel=" stylesheet" href="https://fonts.googleapis.com/css?family=Comfortaa">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name='apple-mobile-web-app-capable' content='yes' />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name='apple-mobile-web-app-status-bar-style' content='black-translucent' />

</head>

<style>
    /* Stili generali per il form */
    body {
        background-color: #405d6355;
        text-align: center;
    }

    form {
        max-width: 400px;
        margin: 0 auto;
        padding: 20px;
        border: 2px solid #405d63;
        border-radius: 5px;
        background-color: white;
    }

    /* Stili per il select */
    select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 3px;
        margin-bottom: 10px;
    }

    /* Stili per il pulsante */
    #submit,
    #installApp {
        background-color: #405d6355;
        /* Verde */
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 3px;
        cursor: pointer;
    }

    /* Stili per il pulsante al passaggio del mouse */
    #submit:hover,
    #installApp:hover {
        background-color: #405d63;
        /* Verde più scuro */
    }
</style>

<body>
    <form>
        <img src="https://euthmappers.com/app/uploads/2023/05/logo.png" />
        <p>This application is developed during EUthMappers project by Quang Huy NGUYEN</p>
        <label for="Choose the team">Choose the team</label>
        <select name="Team" id="team">
            <option value="none">Non-EUthMappers</option>
            <option value="it">🇮🇹Italy</option>
            <option value="po">🇵🇹Portugal</option>
            <option value="ro">🇷🇴Romania</option>
            <option value="sl">🇸🇰Slovakia</option>
            <option value="sp">🇪🇸Spain</option>
        </select>
        <button id="submit" onclick="passHashTags()">Let's mapping!</button> <br><br>

    </form>

    <p>In case you have not installed iD4ALL application</p>
    <button id="installApp">Install</button>
    <script>
        const hashTags = window.location.hash;
        const team = document.getElementById('team');
        var result = [];
        var comment;
        function updateData() {
            hash = hashTags.substr(1);
            if (window.location.hash) {
                result = hash.split('&').reduce(function (res, item) {
                    var parts = item.split('=');
                    res[parts[0]] = parts[1];
                    return res;
                }, {});

            }
            console.log(result)
        }
        updateData()

        function passHashTags() {
            let newHash = "#";
            let taskcode = result['comment'].replace('%23hotosm-project-', '');
            if (hashTags) {
                switch (team.value) {
                    case 'none':
                        result['locale'] = 'en';
                        break;
                    case 'it':
                        result['locale'] = 'it';
                        result['comment'] = result['comment'] + '#euthMappers' + '#teamItaly'
                        break;
                    case 'po':
                        result['locale'] = 'po';
                        result['comment'] = result['comment'] + '#euthMappers' + '#teamPortugal'
                        break;
                    case 'sl':
                        result['locale'] = 'sl';
                        result['comment'] = result['comment'] + '#euthMappers' + '#teamSlovakia'
                        break;
                    case 'sp':
                        result['locale'] = 'sp';
                        result['comment'] = result['comment'] + '#euthMappers' + '#teamSpain'
                        break;
                    case 'ro':
                        result['locale'] = 'ro';
                        result['comment'] = result['comment'] + '#euthMappers' + '#teamRomania'
                        break;
                }
                result['taskcode'] = taskcode;
                for (let tag in result) {
                    newHash += tag + '=' + result[tag] + '&'
                }
                newHash = newHash.slice(0, -1);
                console.log(newHash);
                window.open(`/iDforALL/${newHash}`, '_blank'); //
            } else {
                window.open('/iDforALL/', '_blank');
            }
            //window.close()
        }
        if (navigator.serviceWorker) {
            // Start registration process on every page load 
            window.addEventListener('load', () => {
                navigator.serviceWorker
                    // The register function takes as argument 
                    // the file path to the worker's file 
                    .register('sw.js')
                    // Gives us registration object 
                    .then(reg => console.log('Service Worker Registered'))
                    .catch(swErr => console.log(
                        `Service Worker Installation Error: ${swErr}}`));
            });
        }

        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent the default prompt from showing automatically
            e.preventDefault();
            // Save the event for later use
            deferredPrompt = e;
            console.log(e)
        });
        document.getElementById('installApp').addEventListener('click', async () => {
            console.log('click')
            if (deferredPrompt) {
                // Show the installation prompt
                deferredPrompt.prompt();

                // Wait for the user's choice
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response: ${outcome}`);

                // Clear the saved prompt
                deferredPrompt = null;
            }
        });
    </script>
</body>

</html>
