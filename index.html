<!DOCTYPE html>
<html>
  <head>
    <meta charset='utf-8'>
  <meta name="pwa-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="canonical" href="https://kaheetonaa.github.io/id_sandbox_for_all/" />
  <title>iD4ALL</title>
  <link rel='stylesheet' href='dist/iD.css'>
  <link rel='icon' type='icon/icon-4all.png'>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Comfortaa">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name='apple-mobile-web-app-capable' content='yes' />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name='apple-mobile-web-app-status-bar-style' content='black-translucent' />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style type='text/css'>
      /* apply document-level styling to standalone iD only */
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        /* disable elastic page bounce upon scroll */
        overflow: hidden;
      }
      .virtual-key {
        display: block;
      }

      .circle-button {
        width: 5vw;
        height: 5vw;
        /* Width of the button */
        aspect-ratio: 1/1;
        /* Height of the button */
        border-radius: 50%;
        /* Makes the button circular */
        border: none;
        /* No border */
        color: white;
        /* Text color */
        background-color: hsla(194, 78%, 65%, 0.5);
        /* Button color */
        font-size: 32px;
        /* Font size */
        cursor: pointer;
        /* Change cursor to pointer */
        position: absolute;
        /* Position absolute for free placement */
        display: flex;
        /* Flexbox for centering text */
        justify-content: center;
        /* Center text horizontally */
        align-items: center;
        /* Center text vertically */
        transition: background-color 0.3s;
        /* Smooth background color transition */
        z-index: 20;
      }

      .circle-button:hover {
        background-color: hsla(194, 78%, 65%, 0.8);
        /* Darker shade on hover */
      }

      /* Positioning buttons at different locations */
      #enter {
        bottom: 10%;
        /* 20% from the top */
        right: 10%;
        /* 20% from the left */
      }

      #delete {
        bottom: 10%;
        /* 20% from the bottom */
        right: 20%;
        /* Center horizontally */
      }

      #Q {
        bottom: 10%;
        /* 60% from the top */
        right: 30%;
        /* 20% from the right */
      }

      @media screen and (orientation: portrait) {
      .virtual-key {
        display: block;
      }

      .circle-button {
        width: 15vw;
        height: 15vw;
        /* Width of the button */

        /* Height of the button */
        border-radius: 50%;
        /* Makes the button circular */
        border: none;
        /* No border */
        color: white;
        /* Text color */
        background-color: hsla(194, 78%, 65%, 0.5);
        /* Button color */
        font-size: 32px;
        /* Font size */
        cursor: pointer;
        /* Change cursor to pointer */
        position: absolute;
        /* Position absolute for free placement */
        display: flex;
        /* Flexbox for centering text */
        justify-content: center;
        /* Center text horizontally */
        align-items: center;
        /* Center text vertically */
        transition: background-color 0.3s;
        /* Smooth background color transition */
        z-index: 20;
      }

      .circle-button:hover {
        background-color: hsla(194, 78%, 65%, 0.8);
        /* Darker shade on hover */
      }

      /* Positioning buttons at different locations */
      #enter {
        bottom: 10%;
        /* 20% from the top */
        right: 10%;
        /* 20% from the left */
      }

      #delete {
        bottom: 10%;
        /* 20% from the bottom */
        right: 30%;
        /* Center horizontally */
      }

      #Q {
        bottom: 10%;
        /* 60% from the top */
        right: 50%;
        /* 20% from the right */
      }
    }
    </style>
  </head>

  <body>
    <div class="virtual-key">
      <button class="circle-button" id="enter"><i class="fa fa-check"></i></button>
      <button class="circle-button" id="delete"><i class="fa fa-close"></i></button>
      <button class="circle-button" id="Q"><i class="fa fa-square"></i></button>
    </div>
    <div id='id-container'></div>

    <script>
      var container = document.getElementById('id-container');
      var newScript = document.createElement('script');
      newScript.type = 'text/javascript';
      newScript.onload = checkScript;
      newScript.onerror = checkScript;
      newScript.src = 'dist/iD.js';

      document.getElementsByTagName('head')[0].appendChild(newScript);

            .containerNode(container);

            context.features().disable('boundaries');
          }

      }
    </script>
  </body>
</html>
